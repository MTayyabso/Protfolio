<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8F00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4DD0E1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon background -->
  <path d="M25 5 L40 13.66 L40 30.34 L25 39 L10 30.34 L10 13.66 Z" fill="url(#logoGradient)" opacity="0.2" />
  
  <!-- Hexagon border -->
  <path d="M25 5 L40 13.66 L40 30.34 L25 39 L10 30.34 L10 13.66 Z" stroke="url(#logoGradient)" stroke-width="2" fill="none" />
  
  <!-- Inner accent lines -->
  <path d="M25 12 L25 32" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" />
  <path d="M18 18 L32 26" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M18 26 L32 18" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  
  <!-- Code brackets -->
  <text x="25" y="28" fill="url(#logoGradient)" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Inter', sans-serif">&lt;/&gt;</text>
</svg>
